name: Churnaut CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_SNIPPET_CDN_URL: https://placeholder.com
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-key
      UPSTASH_REDIS_REST_URL: https://placeholder-redis.upstash.io
      UPSTASH_REDIS_REST_TOKEN: placeholder-token
      CRON_SECRET: placeholder-cron-secret
      ENCRYPTION_KEY: placeholder-encryption-key-must-be-long-32-chars
      LEMONSQUEEZY_WEBHOOK_SECRET: placeholder-lemonsqueezy-webhook-secret
      RESEND_API_KEY: placeholder-resend-api-key
      TOGETHER_API_KEY: placeholder-together-api-key


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

      - name: Run Vitest unit tests
        run: npm test

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run unauthenticated fail-closed browser tests
        run: npx playwright test tests/e2e/auth.spec.ts -g "unauthenticated|stalled" --retries=0

      - name: Run authenticated browser tests on protected main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_BASE_URL" ] || [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::warning::Authenticated E2E is blocked: configure E2E_BASE_URL, E2E_EMAIL, and E2E_PASSWORD in the protected environment."
            exit 0
          fi
          npm run test:e2e
